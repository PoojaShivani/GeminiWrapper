<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chat-container { max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        #messages { height: 300px; overflow-y: scroll; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 8px; padding: 5px 10px; border-radius: 5px; }
        .user-message { background-color: #e0f7fa; text-align: right; }
        .gemini-message { background-color: #fce4ec; text-align: left; }
        input[type="text"] { width: calc(100% - 80px); padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h1>Gemini Chat</h1>
        <div id="messages">
            </div>
        <input type="text" id="user-input" placeholder="Type your message...">
        <button onclick="sendMessage()">Send</button>
        <p id="error-message" class="error"></p>
    </div>

    <script>
        const chatApiUrl = 'http://localhost:5000/api/chat'; // Ensure this matches your Flask app's port
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const errorMessageDiv = document.getElementById('error-message');

        function addMessage(sender, text) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.classList.add(sender === 'user' ? 'user-message' : 'gemini-message');
            messageElement.textContent = text;
            messagesDiv.appendChild(messageElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll to bottom
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') {
                return; // Don't send empty messages
            }

            addMessage('user', message);
            userInput.value = ''; // Clear input field
            errorMessageDiv.textContent = ''; // Clear previous errors

            try {
                const response = await fetch(chatApiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                addMessage('gemini', data.response);

            } catch (error) {
                console.error('Error sending message:', error);
                errorMessageDiv.textContent = 'Error: Could not connect to the backend or Gemini API. ' + error.message;
                addMessage('system', 'Error: Failed to get response from Gemini.');
            }
        }

        userInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial message
        addMessage('gemini', 'Hello! I am Gemini. How can I help you today?');
    </script>
</body>
</html>
